[project]
name = "market-review-api"
version = "0.0.1"
description = "收盘复盘仪表盘 · 后端 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "httpx>=0.28",
    "cachetools>=5.5",
    "apscheduler>=3.10",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "tushare>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true